name: OpenWrtMonitor
options:
  bundleIdPrefix: com.catmint
  deploymentTarget:
    iOS: "26.0"
  projectFormat: xcode15_3
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  SSH2:
    path: Packages/libssh2-apple
targets:
  OpenWrtMonitor:
    type: application
    platform: iOS
    sources:
      # Info.plist 由下面的 info: 生成并作为 INFOPLIST_FILE 使用，
      # 不能再当资源复制一遍，否则会报「Multiple commands produce …/Info.plist」。
      - path: Sources
        excludes:
          - Info.plist
    dependencies:
      - package: SSH2
    info:
      path: Sources/Info.plist
      properties:
        # ── 120Hz ProMotion（v3.3.6，2026-11-24）───────────────────────────
        # **别再删这一行。** iPhone 上第三方 App 默认被锁在 60Hz：Apple 官方文档
        # 原话是「不配置此 Key 时，Core Animation 不会使用高于 60Hz 的帧率」，
        # 所以滚动写得再顺也顶在 60，跟手机有没有 ProMotion 无关。
        #
        # 设成 true 之后，UIKit / SwiftUI / CAAnimation / SpriteKit 会自己接管
        # frame pacing（Apple：“Frameworks that automatically handle frame pacing”），
        # UIScrollView（也就是 SwiftUI 的 ScrollView / List）惯性滚动直接上到 120。
        # 项目里不需要手写 CADisplayLink，也不需要给 ScrollView 设帧率——
        # 这一个是 iPhone 唯一的开关。
        #
        # 三点别搞错：
        #   ① 只有 iPhone 需要这个键，iPad Pro 本来不限制（加了也无害）。
        #   ② 它是「允许」不是「强制」：App 改不了屏幕刷新率，只能给系统机会，
        #      由 Core Animation 按当前负载自己决定给多少。
        #   ③ 低电量模式、设置→辅助功能→动态效果→限制帧速率、机身过热时，
        #      系统会主动降回 60 —— 这是设计行为，不是键没生效。
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: OpenWrt 监控
        # v2.4.5：长按输入框弹出的「剪切 / 拷贝 / 自动填充 / 查找」是 UIKit 的
        # 系统菜单，它的语言**不跟手机系统走，跟 App 自己声明支持的本地化走**。
        # 以前只有 CFBundleDevelopmentRegion=zh_CN，没声明任何 localization，
        # UIKit 就按「这个 App 只支持英文」回退，于是整条菜单都是英文。
        # zh-Hans / zh_CN 两种写法都列上，兼容不同 iOS 版本的匹配规则；
        # AllowMixedLocalizations 允许 UIKit 从自己的 framework 里取中文串。
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh-Hans
          - zh_CN
          - en
        CFBundleAllowMixedLocalizations: true
        # ⚠️ 不写这两行，XcodeGen 会把它自己的默认值「1.0 / 1」写进 Info.plist，
        # 直接把 settings 里的 MARKETING_VERSION 盖掉——「关于」页和签名工具里
        # 永远显示 v1.0 (1) 就是这么来的（2026-10-31 实际踩过）。
        # 打包时由 Xcode 把 $(...) 展开成当前版本号，别写成常量。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: 用于通过 SSH 连接局域网内的 OpenWrt 路由器
        # v2.4.12：壁纸改成自建相册网格（系统 PhotosPicker 每次弹都从顶部开始，
        # 裁切页取消后回不到原位），直接读相册就必须声明这条权限说明，
        # 少了它第一次请求授权会直接崩。
        NSPhotoLibraryUsageDescription: 选择一张照片作为 App 的自定义背景
        NSBonjourServices:
          - _ssh._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 全屏的前提：有 UILaunchScreen（哪怕是空字典）系统才认为这是「现代 App」，
        # 否则会按旧版小屏 App 处理，四周强制加黑边。
        UILaunchScreen: {}
        # UIRequiresFullScreen 在 iOS 26 已废弃（iPad 多任务相关），对 iPhone 无意义，
        # 留着只会让系统按「老 App」对待，删掉更安全。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # ⚠️ 必须显式写 PRODUCT_NAME：XcodeGen 不写这一项时，Xcode 会拿默认的
        # $(TARGET_NAME) 去解析，一旦解析成空串，归档产物就变成 Applications/.app，
        # 于是「建目录」和「链接」两条命令抢同一个输出，报
        # error: Multiple commands produce '.../Applications/.app'（2026-10-30 实际踩过）。
        PRODUCT_NAME: OpenWrtMonitor
        # Swift 模块名跟着 PRODUCT_NAME 走，显式写出来，避免以后改显示名时把
        # 模块名带歪（改了模块名，所有源文件都不需要动，但 import 会变）。
        PRODUCT_MODULE_NAME: OpenWrtMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.catmint.openwrtmonitor
        MARKETING_VERSION: 3.4.6
        CURRENT_PROJECT_VERSION: 226
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        # 新版构建系统已经不支持老式 headermap，这里显式关掉，避免那条
        # "Traditional headermap style is no longer supported" 警告。
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OpenWrtMonitor:
    build:
      targets:
        OpenWrtMonitor: all
    run:
      config: Debug
    archive:
      config: Release
